name: OpenAPI Schema Validation

on:
  pull_request:
    paths:
      - 'nra-tax-engine/src/api/**'
      - 'nra-tax-engine/src/orchestrator/**'
  push:
    branches:
      - main

jobs:
  validate-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: nra-tax-engine
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"

      - name: Generate OpenAPI schema
        working-directory: nra-tax-engine
        run: |
          source .venv/bin/activate
          python -c "
import json
from src.api.main import app
schema = app.openapi()
with open('openapi.json', 'w') as f:
    json.dump(schema, f, indent=2)
print('Schema generated successfully')
"

      - name: Compare with committed schema
        run: |
          cd nra-tax-engine
          if [ -f openapi.json ]; then
            git diff --exit-code openapi.json || echo "Schema has changed! Please regenerate api-types.ts"
          fi

      - name: Validate client types match
        working-directory: nra-tax-client
        run: |
          npm install
          npm run sync-api 2>/dev/null || echo "No API schema sync needed or failed"

      - name: Fail if schema drifts
        run: |
          cd nra-tax-engine
          if [ -f openapi.json ]; then
            if ! git diff --quiet openapi.json; then
              echo "::error::OpenAPI schema has changed. The committed schema does not match the generated schema."
              echo "Please run: cd nra-tax-engine && python -c \"from json import dump; from src.api.main import app; dump(app.openapi(), open('openapi.json', 'w'), indent=2)\""
              exit 1
            fi
          fi