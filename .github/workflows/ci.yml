name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nra-tax-engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nra-tax-engine (with dev extras)
        run: pip install -e .[dev]

      - name: Run test suite
        run: python3 -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nra-tax-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nra-tax-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

  openapi-drift:
    name: OpenAPI schema drift check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nra-tax-client/package-lock.json

      - name: Install nra-tax-engine (with dev extras)
        working-directory: nra-tax-engine
        run: pip install -e .[dev]

      - name: Install nra-tax-client dependencies
        working-directory: nra-tax-client
        run: npm ci

      - name: Regenerate openapi.json from the FastAPI schema
        working-directory: nra-tax-engine
        run: python -m scripts.gen_openapi --out ../nra-tax-client/openapi.json

      - name: Regenerate api-types.ts from openapi.json
        working-directory: nra-tax-client
        run: npx openapi-typescript ./openapi.json -o ./src/lib/api-types.ts

      - name: Fail if generated files drifted from committed versions
        run: |
          git diff --exit-code -- nra-tax-client/openapi.json nra-tax-client/src/lib/api-types.ts
