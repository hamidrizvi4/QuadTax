[project]
name = "nra-tax-engine"
version = "0.1.0"
description = "A hybrid tax preparation engine for Nonresident Alien (F-1/J-1) international students"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.6,<3.0",
    "anthropic>=0.25,<1.0",
    "openai>=1.20,<2.0",
    "python-dotenv>=1.0,<2.0",
    "pypdf>=4.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23,<1.0",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "slowapi>=0.1.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "black>=24.0",
    "ruff>=0.4",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
